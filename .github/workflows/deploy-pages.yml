name: Deploy Papa Rentals to GitHub Pages

# Publishes the built app to the `gh-pages` branch, which is what GitHub Pages
# actually serves for this repo (Settings -> Pages -> Source: Deploy from a branch).
#
# This used to upload a Pages *artifact* via actions/deploy-pages, which only
# works when the Pages source is set to "GitHub Actions". It wasn't, so those
# runs went green while the live site kept serving an old gh-pages commit.
# Publishing to the branch keeps the workflow and the Pages setting in agreement.

on:
  push:
    branches:
      - main
      - 'claude/papa-rentals-**'
    paths:
      - 'papa-rentals/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; the last push to finish owns the live site.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: papa-rentals/package-lock.json

      - name: Install
        run: npm ci
        working-directory: papa-rentals

      - name: Build
        run: npm run build
        working-directory: papa-rentals

      - name: Publish to gh-pages
        working-directory: papa-rentals/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pages would otherwise run Jekyll and drop paths it treats as special.
          touch .nojekyll
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          # A single-commit force push: gh-pages holds build output only, so its
          # history is noise -- the source branch is the record that matters.
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      - name: Summary
        run: echo "Deployed https://swagofthenerd-gif.github.io/Scrrenplay-papa/" >> "$GITHUB_STEP_SUMMARY"
